name: CI

# Gates every PR and main on the same checks a deploy depends on. The app is
# static, so a green build here is the whole deploy risk.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    uses: richardsolomou/ras-stack/.github/workflows/check-js.yml@v0.8.0
    with:
      command: just check
      just-version: '1.58.0'

  end-to-end:
    uses: richardsolomou/ras-stack/.github/workflows/check-browser.yml@v0.8.0
    with:
      prepare-command: pnpm build
      command: pnpm test:e2e:run
      artifact-name: playwright-traces
      artifact-path: test-results/

  release:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [check, end-to-end]
    permissions:
      contents: write
    uses: richardsolomou/ras-stack/.github/workflows/release-changesets.yml@v0.8.0
    secrets: inherit
