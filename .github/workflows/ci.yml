name: CI

# Gates every PR and main on the same checks a deploy depends on. The app is
# static, so a green build here is the whole deploy risk.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: richardsolomou/ras-stack/actions/setup-js@v0.1.0

      - name: Run independent checks
        run: |
          set -euo pipefail
          pids=()
          pnpm format:check & pids+=("$!")
          pnpm lint & pids+=("$!")
          pnpm typecheck & pids+=("$!")
          pnpm test & pids+=("$!")
          pnpm build & pids+=("$!")
          status=0
          for pid in "${pids[@]}"; do
            wait "$pid" || status=1
          done
          exit "$status"

  end-to-end:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: richardsolomou/ras-stack/actions/setup-js@v0.1.0

      - name: Build
        run: pnpm build

      - name: End-to-end
        run: pnpm test:e2e:run

      - name: Upload failure traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  release:
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    needs: [check, end-to-end]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.CHANGESETS_TOKEN || secrets.GITHUB_TOKEN }}
      - uses: richardsolomou/ras-stack/actions/setup-js@v0.1.0
      - name: Release pending changesets
        env:
          GH_TOKEN: ${{ secrets.CHANGESETS_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          count=0
          shopt -s nullglob
          for file in .changeset/*.md; do
            if grep -qE ': (patch|minor|major)$' "$file"; then
              count=$((count + 1))
            fi
          done
          if [ "$count" = "0" ]; then
            exit 0
          fi
          git fetch origin main --tags
          test "$(git rev-parse origin/main)" = "$GITHUB_SHA"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          pnpm version-packages
          tag="v$(node -p "require('./package.json').version")"
          git add .changeset CHANGELOG.md package.json
          git commit -m "chore: release ${tag} [skip ci]"
          git tag "$tag"
          git push --atomic origin HEAD:main "$tag"
          gh release create "$tag" --title "$tag" --generate-notes
