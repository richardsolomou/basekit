# New releases have to sit for a week before they can be installed, so a
# compromised publish has time to be noticed. It only applies when resolving
# something new — an install against this lockfile is unaffected. To take a
# fresher release deliberately: pnpm add --config.minimumReleaseAge=0 <pkg>
minimumReleaseAge: 10080
allowBuilds:
  '@posthog/cli': true
  core-js: true
  esbuild: true
  ras-stack@https://codeload.github.com/richardsolomou/ras-stack/tar.gz/eb0b4a67d395dec7fdcb220597681fb30560567e#path:/packages/ras-stack: true

minimumReleaseAgeExclude:
  # Reviewed exact versions from the RAS candidate; retain the seven-day gate for other packages.
  - '@posthog/browser-common@0.9.5'
  - '@posthog/core@1.59.1'
  - posthog-js@1.438.12
